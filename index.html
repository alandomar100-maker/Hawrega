<style>
:root{--bg:#FFF6EC;--surface:#fff;--ink:#3b2314;--muted:#8a6a55;--line:#FFD9B8;--accent:#FF7A1A;--accent2:#E85D04;--on-accent:#fff;--ok:#16a34a;--bad:#dc2626;--chip:#FFEBD6;color-scheme:light;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
*{-webkit-tap-highlight-color:transparent}
button,.tabs{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic",system-ui,Tahoma,sans-serif;line-height:1.7;padding-bottom:96px}
header{background:linear-gradient(135deg,#FF9A3C,#FF6A00);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) max(18px,calc((100% - 640px)/2)) 40px;border-radius:0 0 32px 32px;box-shadow:0 10px 24px rgba(255,106,0,.25)}
h1{font-size:1.9rem;font-weight:800;margin:0}
header p{margin:2px 0 0;font-size:.95rem;opacity:.95}
.deco{font-size:1.5rem;letter-spacing:.35rem;margin-top:8px}
main{max-width:640px;margin:26px auto 0;padding:0 16px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -6px 20px rgba(255,122,26,.12)}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.8rem;padding:6px 4px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tabs button span{font-size:1.4rem}
.tabs button{position:relative;z-index:1}
#pill{position:absolute;top:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:0;width:0;background:var(--chip);border-radius:16px;z-index:0;pointer-events:none;transition:transform .45s cubic-bezier(.22,1,.36,1),width .45s cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion:reduce){#pill{transition:none}}
.tabs button[aria-selected="true"]{color:var(--accent2);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{position:relative;z-index:1;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:.88rem;padding:4px 14px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
#frow{position:relative}
#fpill{position:absolute;left:0;top:0;width:0;height:0;background:linear-gradient(135deg,#FF9A3C,#FF6A00);border-radius:99px;z-index:0;pointer-events:none;box-shadow:0 4px 10px rgba(255,106,0,.3)}
#frow .chip[aria-pressed="true"]{background:transparent;border-color:transparent}
input,select{width:100%;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--accent);outline:0}
label{display:block;font-size:.88rem;color:var(--muted);margin:12px 0 3px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:#fff;border-radius:22px;padding:6px 16px 16px;box-shadow:0 8px 24px rgba(255,122,26,.14)}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 6px 16px rgba(255,122,26,.10)}
.route{display:flex;gap:12px}
.road{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.dot{font-size:1.05rem;line-height:1}
.dash{flex:1;min-height:24px;width:0;border-inline-start:3px dashed var(--accent);margin:3px 0}
.stops{flex:1}
.stops b{display:block;font-weight:700}
.stops span.gap{display:block;height:12px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:.82rem;color:var(--ink)}
.meta i{font-style:normal;background:var(--chip);border-radius:99px;padding:1px 10px}
.price{font-weight:800;font-size:1.05rem;color:var(--accent2);text-align:end}
.btn{border:0;font:inherit;font-weight:700;padding:10px 18px;border-radius:99px;cursor:pointer;background:linear-gradient(135deg,#FF9A3C,#FF6A00);color:#fff;box-shadow:0 4px 10px rgba(255,106,0,.3)}
.btn.sec{background:var(--chip);color:var(--accent2);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:none}
.btn.no{background:#fff;color:var(--bad);border:2px solid var(--bad);box-shadow:none}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.st{font-size:.82rem;font-weight:700}
.st.accepted{color:var(--ok)}.st.rejected{color:var(--bad)}.st.cancelled{color:var(--bad)}.st.pending{color:var(--muted)}
.calc{background:var(--chip);border:2px dashed var(--accent);border-radius:16px;padding:12px;margin:14px 0;font-size:.92rem}
.calc strong{font-size:1.2rem;color:var(--accent2)}
h2{font-size:1.1rem;margin:24px 0 4px;font-weight:800}
.empty{color:var(--muted);text-align:center;padding:24px 8px;background:#fff;border-radius:20px;margin:10px 0}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--accent2);color:#fff;padding:10px 20px;border-radius:99px;font-size:.9rem;z-index:120;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.timebtn{width:100%;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;display:block;text-align:start}
.timebtn b{font-weight:400;font-size:inherit;direction:ltr;unicode-bidi:isolate;color:var(--ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(59,35,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(255,106,0,.25)}
.tdisp{background:linear-gradient(135deg,#FF9A3C,#FF6A00);color:#fff;border-radius:22px;text-align:center;padding:8px;font-size:2.6rem;font-weight:800;direction:ltr;line-height:1.3}
.tdisp small{font-size:1rem;margin-inline-start:8px}
.tgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 4px;direction:ltr}
.tgrid button{border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;border-radius:99px;padding:8px 0;cursor:pointer}
.tgrid button[aria-pressed="true"]{background:linear-gradient(135deg,#FF9A3C,#FF6A00);color:#fff;border-color:transparent}
.tap{display:flex;gap:8px;margin:12px 0 4px}
.tap .chip{flex:1;padding:8px 4px}
.cf{text-align:center}
.cfe{font-size:3rem;line-height:1.3}
.cf h3{margin:2px 0;font-size:1.15rem;font-weight:800}
.cf p{margin:6px 0 16px;color:var(--muted)}
.cf .foot .btn{flex:1}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}

header{position:relative}
.hbtns{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:16px;display:flex;gap:8px}
.badge{position:absolute;top:-7px;inset-inline-end:-5px;background:#e11d48;color:#fff;border-radius:99px;font-size:.68rem;padding:0 6px;line-height:1.5}
.ntsheet{max-height:82vh;overflow:auto}
.nth{margin:0 0 8px;font-size:1.15rem;font-weight:800}
.nt{margin:8px 0;padding:12px}
.ntt{font-weight:700}
.lgbtn{position:relative;border:0;border-radius:99px;background:rgba(255,255,255,.28);color:#fff;font:inherit;font-size:.85rem;font-weight:700;padding:4px 12px;cursor:pointer}
html[lang="en"] body,html[lang="en"] button,html[lang="en"] input,html[lang="en"] select{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tabs button em{font-style:normal}
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow input{flex:1;min-width:0}
.mapbtn{display:block;width:100%;margin-top:6px;border:2px dashed var(--accent);background:var(--chip);color:var(--accent2);border-radius:14px;font:inherit;font-weight:700;font-size:.9rem;padding:8px;cursor:pointer}
.routeinfo{margin:10px 0 0;font-weight:700;color:var(--accent2);min-height:1.2em}
.mapbox{position:relative;isolation:isolate;z-index:0;height:60vh;min-height:340px;border-radius:22px;overflow:hidden;border:2px solid var(--line);box-shadow:0 8px 24px rgba(255,122,26,.14);margin-top:8px}
#bigmap,#pkmap{width:100%;height:100%}

  var o=before[e.dataset.flip];
  if(o){var n=e.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top,sx=o.width/n.width,sy=o.height/n.height;

function emk(e){return L.divIcon({html:'<div class="emk">'+e+'</div>',className:"",iconSize:[34,34],iconAnchor:[17,30],popupAnchor:[0,-26]})}
function tiles(m){L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m)}
function fetchRoute(a,b,cb){
 fetch("https://router.project-osrm.org/route/v1/driving/"+a[1]+","+a[0]+";"+b[1]+","+b[0]+"?overview=simplified&geometries=geojson").then(function(r){return r.json()}).then(function(j){
  if(!j.routes||!j.routes[0]){cb(null);return}
  var r=j.routes[0],c=r.geometry.coordinates,step=Math.max(1,Math.ceil(c.length/120)),g=[],i;
  for(i=0;i<c.length;i+=step)g.push([+c[i][1].toFixed(5),+c[i][0].toFixed(5)]);
  var l=c[c.length-1];g.push([+l[1].toFixed(5),+l[0].toFixed(5)]);
  cb({dist:Math.round(r.distance/100)/10,dur:Math.round(r.duration/60),geom:g});
 }).catch(function(){cb(null)});
}

function initBigMap(){
 var box=document.getElementById("bigmap");if(!box)return;
 if(!mapOK()){box.parentNode.innerHTML='<div class="empty" style="margin:0;height:100%">🗺️ '+t("map_unavail")+'</div>';return}
 var rs=state.routes.filter(function(r){return r.fromLL&&r.toLL&&rideActive(r)});
 var m=L.map(box).setView(DEF,12);bigMap=m;tiles(m);
 var grp=L.featureGroup().addTo(m);
 rs.forEach(function(r){
  var line=L.polyline(r.geom||[r.fromLL,r.toLL],{color:"#FF7A1A",weight:5,opacity:.85,dashArray:r.geom?null:"8 8"}).addTo(grp);
  var a=L.marker(r.fromLL,{icon:emk("🟠")}).addTo(grp),b=L.marker(r.toLL,{icon:emk("📍")}).addTo(grp),h=popupHtml(r);
  [line,a,b].forEach(function(x){x.bindPopup(h,{minWidth:190})});
  if(!r.geom)fetchRoute(r.fromLL,r.toLL,function(res){if(res&&bigMap===m){r.geom=res.geom;r.dist=r.dist||res.dist;r.dur=r.dur||res.dur;save();line.setLatLngs(res.geom);line.setStyle({dashArray:null})}});
 });
 if(rs.length)m.fitBounds(grp.getBounds().pad(.2));
 m.on("popupopen",function(e){var el=e.popup.getElement(),b=el&&el.querySelector("[data-preq]");if(b)b.onclick=function(){m.closePopup();startRequest(b.getAttribute("data-preq"))}});

}

function mpSet(ll,name){
